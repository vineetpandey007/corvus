# ============================================================
# Full local stack: API + Neo4j (persistent graph backend).
#
# Usage:
#   cp .env.example .env   # fill in secrets first — see docs/SETUP.md
#   docker compose up --build
#
# API:    http://localhost:8000/docs
# Neo4j:  http://localhost:7474  (browser UI)
# ============================================================
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to point at the compose-managed Neo4j service by name
      # rather than localhost, when graph.backend is set to "neo4j".
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j-data:
