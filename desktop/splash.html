<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1115;
    color: #e9ecef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
  }
  .wrap {
    text-align: center;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid #4c6ef5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4c6ef5;
    display: inline-block;
    margin: 0 4px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  p {
    font-size: 12px;
    color: #868e96;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <h1>Dark Web Identity Correlation Toolkit</h1>
    <p>Starting local backend service&hellip;</p>
  </div>
</body>
</html>
